# Only the platforms this tool ships on, so a dependency pulled in only for some other OS
# cannot flag an advisory or license the image never actually contains. all-features so the
# gated hardware-test code and the dev-dependencies are scanned too, not just the defaults.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # The Marvin RSA timing attack: `rsa` is a transitive dependency (through the yubikey
    # stack alone; sequoia reaches RSA through nettle), but nothing here performs an RSA
    # private-key operation whose timing an attacker could observe -- this tool derives
    # and writes keys, it does not run an RSA decryption oracle. Revisit if PIV RSA slot
    # support is ever added.
    { id = "RUSTSEC-2023-0071", reason = "no RSA private-key operations are performed" },
]

[licenses]
# List of explicitly allowed licenses
allow = [
    # Common open source licenses
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "ISC",
    "LGPL-2.0-or-later",
    "LGPL-3.0-or-later",
    "LGPL-3.0-only",
    "Unicode-3.0",
    # Weird exceptions
    "bzip2-1.0.6",
]

[bans]
# Warn of multiple versions and wildcards
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Force declaration of all crate sources
unknown-registry = "deny"
unknown-git = "deny"
# Use official crate registry
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
# Allow use of custom forks
gitlab = [ "gli.al" ]
