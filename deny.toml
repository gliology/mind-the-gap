# Only the platforms this tool ships on, so a dependency pulled in only for some other OS
# cannot flag an advisory or license the image never actually contains. all-features so the
# gated hardware-test code and the dev-dependencies are scanned too, not just the defaults.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # The Marvin RSA timing attack. The one RSA private-key operation here is signing the
    # PIV chain (src/piv/chain.rs), once, deterministically, on an air-gapped machine:
    # nobody can submit ciphertexts or time the operation, and there is no decryption to
    # make an oracle of. Card-side RSA happens on the card.
    { id = "RUSTSEC-2023-0071", reason = "RSA signing runs offline, with no decryption oracle" },
]

[licenses]
# List of explicitly allowed licenses
allow = [
    # Common open source licenses
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "ISC",
    "LGPL-2.0-or-later",
    "LGPL-3.0-or-later",
    "LGPL-3.0-only",
    "Unicode-3.0",
    # Weird exceptions
    "bzip2-1.0.6",
]

[bans]
# Warn of multiple versions and wildcards
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Force declaration of all crate sources
unknown-registry = "deny"
unknown-git = "deny"
# Use official crate registry
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# yubikey.rs's pending PRs (the fork's mind-the-gap branch), until they are released
allow-git = [ "https://github.com/FlorianFranzen/yubikey.rs" ]

[sources.allow-org]
# Allow use of custom forks
gitlab = [ "gli.al" ]
