[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "we do not use RSA in this code" }
]

[licenses]
# List of explicitly allowed licenses
allow = [
    # Common open source licenses
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "ISC",
    "LGPL-2.0-or-later",
    "LGPL-3.0-or-later",
    "LGPL-3.0-only",
    "Unicode-3.0",
    # Weird exceptions
    "bzip2-1.0.6",
]

[bans]
# Warn of multiple versions and wildcards
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Force declaration of all crate sources
unknown-registry = "deny"
unknown-git = "deny"
# Use official crate registry
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
# Allow use of custom forks
gitlab = [ "gli.al" ]
