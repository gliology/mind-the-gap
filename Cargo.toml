[package]
name = "mind-the-gap"
description = "Derive smart card keys and certs from mnemonic seeds"
version = "0.2.2"
authors = ["Florian Franzen <florian@gli.al"]
license = "LGPL-3.0-or-later"
edition = "2021"
default-run = "mind-the-gap"
#build = "build.rs"

[dependencies]
# Command line interface
clap = { version = "4.3", features = [ "derive", "cargo", "env" ]}
clap_complete = "4.4"
clap_mangen = "0.3"

log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"

# To parse dates and times
chrono = "0.4"
humantime = "2.1"

# Clear sensitive data
zeroize = "1.1"
rand_core = { version = "0.9", features = ["os_rng"] }

# Mnemonic handling
tiny-bip39 = "2.0"

# Key Derivation
argon2 = "0.5"
base64 = "0.22"

# QR code output
qrcode = { version = "0.14", default-features = false }

# OpenPGP and Smartcard modules
sequoia-openpgp = { git = "https://gitlab.com/gli.al/sequoia.git", tag = "openpgp/v2.2.0-mtg0" }
openpgp-card = "0.5"
card-backend-pcsc = "0.5"
secrecy = "0.8"

# Yubikey PIV module
yubikey = { version = "0.9.0-pre.0",  features = [ "untested" ]}
x509-cert = "0.3.0-rc.4"
der = "0.8"
spki = { version = "0.8", features = [ "fingerprint" ]}
sha2 = "0.10"
p256 = "0.14.0-rc.9"
ed25519-dalek = { version = "3.0.0-pre.7", features = [ "alloc", "pkcs8" ]}
pem-rfc7468 = "1.0"

[lib]
doctest = false
