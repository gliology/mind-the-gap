[package]
name = "mind-the-gap"
description = "Derive smart card keys and certs from mnemonic seeds"
version = "0.2.2"
authors = ["Florian Franzen <florian@gli.al"]
edition = "2021"
default-run = "mind-the-gap"
build = "build.rs"

[dependencies]
# Command line interface
clap = { version = "4.3", features = [ "derive", "cargo", "env" ]}
clap_complete = "4.4"
clap_mangen = "0.3"

log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1.0"

# To parse dates and times
chrono = "0.4"
humantime = "2.1"

# Clear sensitive data
zeroize = "1.1"
rand_core = { version = "0.9", features = ["os_rng"] }

# Mnemonic handling
tiny-bip39 = "2.0"

# Key Derivation
argon2 = "0.5"
base64 = "0.22"

# QR code output
qrcode = { version = "0.14", default-features = false }

# OpenPGP and Smartcard modules
sequoia-openpgp = { git = "https://gitlab.com/gli.al/sequoia.git", tag = "openpgp/v2.2.0-mtg0" }
openpgp-card = "0.5"
card-backend-pcsc = "0.5"
secrecy = "0.8"

# Yubikey PIV module
yubikey = { version = "0.9.0-pre.0",  features = [ "untested" ]}
# Features declared explicitly: `builder` gates CertificateBuilder/BuilderProfile *and* the
# TryFrom<SubjectPublicKeyInfoRef> impls for Subject/AuthorityKeyIdentifier, `hazmat` gates
# Time::INFINITY. They currently also arrive via yubikey's own dependency, but relying on
# feature unification would break on a yubikey patch release.
x509-cert = { version = "0.3.0-rc.4", features = [ "builder", "hazmat", "pem" ]}
der = { version = "0.8", features = [ "oid", "alloc", "flagset" ]}
spki = { version = "0.8", features = [ "fingerprint", "alloc" ]}
# Degenerate PKCS#7 (certs-only SignedData) for the YubiKey msroots object.
# Pins x509-cert 0.3.0-rc.4 and der/spki 0.8.0-rc.*, which unify with the releases above.
cms = { version = "0.3.0-pre.2", features = [ "std" ]}
# NOTE: this is sha2 0.10 while yubikey/ecdsa pull sha2 0.11. Two majors coexist fine here
# because no sha2 type crosses the boundary -- do not "fix" this by bumping it.
sha2 = "0.10"
# Default features already give arithmetic + ecdsa + pem(-> pkcs8) + std(-> alloc), which is
# exactly the set x509-cert's Builder::build bounds require.
p256 = "0.14.0-rc.9"

[lib]
doctest = false
