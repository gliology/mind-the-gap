[package]
name = "mind-the-gap"
description = "Derive smart card keys and certs from mnemonic seeds"
# The major version tracks the derivation scheme: 0.x derived under the legacy scheme
# (`mtg0`, OpenPGP only), 1.x derives under the current labelled scheme (`mtg1`). A future
# scheme change is a breaking change by definition and bumps the major.
version = "1.0.0-rc.1"
authors = ["Florian Franzen <florian@gli.al>"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/gliology/mind-the-gap"
readme = "README.md"
edition = "2024"
# Matches the toolchain pinned in rust-toolchain.toml
rust-version = "1.93"
default-run = "mind-the-gap"
build = "build.rs"

[features]
# Hardware tests are DESTRUCTIVE. They reset the attached YubiKey, wiping every key,
# certificate and object on it, and they refuse to run unless the target card's serial is
# named explicitly:
#
#     MTG_HARDWARE_TEST_SERIAL=<serial> cargo test --features destructive-hardware-tests --test piv_hardware
#
# The OpenPGP suite names its card by ident instead (MTG_HARDWARE_TEST_CARD=<ident>,
# --test pgp_hardware). Use a spare card. See docs/hardware-tests.md.
destructive-hardware-tests = []

# Safety interlock -- never enable this by hand.
#
# `--all-features` turns on *every* feature, so without this a routine
# `cargo test --all-features` would silently wipe whatever card happened to be plugged in.
# The hardware tests compile only when `destructive-hardware-tests` is on and this is off,
# so enabling both -- exactly what `--all-features` does -- compiles them out instead.
no-destructive-hardware-tests = []

[dependencies]
# Command line interface
# `string` lets the config file's values become clap's own defaults, see src/cli/config.rs
clap = { version = "4.3", features = [ "derive", "cargo", "env", "string" ]}
# Shell completions and the man page, written by the mind-the-build binary at package time
clap_complete = "4.4"
clap_mangen = "0.3"

# Logging: the facade the library and the card stacks log through, and its backend behind
# the wrapper in src/cli/logging.rs that keeps card traffic out of the log. The logger
# prints no timestamps, so its default humantime feature, which pulls in jiff, stays off.
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "regex"] }

# Error handling
anyhow = "1.0"

# Dates and the calendar a validity counts on. Default features off: nothing reads the clock
# or the local time zone (creation times are fixed or given), so `clock` and its tz tree
# stay out.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The times a ceremony transcript and a revocation list are stamped with, as RFC 3339
humantime = "2.1"

# Clear sensitive data
zeroize = "1.1"

# Process hardening in src/main.rs: default SIGPIPE handling, no core dumps, no ptrace,
# memory locked against swap
libc = "0.2"

# No-echo terminal prompt for the seed phrase and password, see src/prompt.rs
rpassword = "7.5"

# Line editing for the interactive session. Default features off so the file-backed
# history (and its fd-lock dependency) cannot even be compiled in: history lives in
# memory only and dies with the session.
rustyline = { version = "18", default-features = false }

# Shell-style splitting of interactive lines, so `-n 'Jane Doe'` works at the prompt
shlex = "1"

# Alternate-screen QR display and raw-mode key reads, see src/qr.rs. Default features
# off keeps the event system (and its mio/signal-hook tree) out; this replaces what
# would otherwise be hand-rolled unsafe termios and ioctl calls, the same trade as
# rpassword for the prompts.
crossterm = { version = "0.29", default-features = false }

# Timeout-bounded wait on the tty when telling a bare Esc from an escape sequence;
# already in crossterm's tree, used directly for its safe poll wrapper
rustix = { version = "1", features = ["event"] }

# OS entropy for minting seeds, sampling the transcription quiz and the nonce of the PIV
# signature challenge; the lowest-level interface to the kernel CSPRNG, and a version
# already shared with the card stacks
getrandom = "0.4"

# Mnemonic handling. Default features off: the `rand` feature would pull a second,
# older rand stack for an API this crate never calls (seeds come from `getrandom`
# above), and the optional wordlists are unused -- English is always built in.
tiny-bip39 = { version = "2.0", default-features = false }

# The password in NFKD before it is stretched (src/mnemonic.rs), as BIP-39 takes its
# passphrase, so that one password typed differently derives the same keys. Part of mtg1
# like argon2 below. Already in the tree through tiny-bip39.
unicode-normalization = { version = "0.1", default-features = false, features = ["std"] }

# Key Derivation
#
# NOTE: argon2 0.5 is shared with the sequoia fork, and its output is a frozen constant
# of the mtg1 scheme -- do not bump it alone: a new major here is a new derivation
# scheme by definition, like sha2 below. Default features off, so that this crate does
# not ask for the PHC-string API itself (sequoia brings it in regardless); key material
# flows through `hash_password_into` alone. `zeroize` wipes the 64 MiB of block memory and
# the hashes every derivation leaves behind, from which its output could be recomputed.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
# Pins and passwords are derived bytes in base64 (src/seed.rs), part of the same scheme
base64 = "0.22"

# RSA keys from a derived seed (src/rsa.rs). The stream the primes are read from, its
# primality test and the arithmetic are part of the frozen mtg1 procedure in the same way
# argon2 is: SHAKE256 is a standard function whose output cannot change, primality is a
# property of the number rather than of the test, and the rsa crate only assembles the key
# from the two primes. Versions follow what yubikey already pulls in, so nothing is new in
# the tree but sha3; default features stay off where they would add a std or rand layer.
# The SHAKE256 state determines both primes, so it is wiped on drop like any other secret.
sha3 = { version = "0.10", default-features = false, features = ["zeroize"] }
crypto-primes = "0.7"
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc"] }
rsa = "0.10.0-rc.18"

# QR code output
qrcode = { version = "0.14", default-features = false }

# OpenPGP and Smartcard modules
#
# Pinned by revision rather than by tag: a tag can be force-moved and `cargo update` would
# follow it, and this fork's two-commit patch set is load-bearing for reproducibility (see
# "The forked sequoia-openpgp" in docs/security.md). The revision is tag openpgp/v2.2.0-mtg0.
# No `version` on purpose: a crates.io build would silently swap in stock sequoia, which
# salts its signatures, so publishing has to fail instead. Default features off: the
# compression algorithms are unused, nothing here compresses or reads compressed packets.
sequoia-openpgp = { git = "https://gitlab.com/gli.al/sequoia.git", rev = "8ea683342764b6dedbf86e8d106d026266412e4d", default-features = false, features = ["crypto-nettle"] }
openpgp-card = "0.7"
card-backend-pcsc = "0.5"
# Asking cards who they are without disturbing them (src/readers.rs): finding one by serial
# or identifier and listing them, where the card libraries would reset every card they
# opened. Already in the tree through card-backend-pcsc and yubikey.
pcsc = "2"
# openpgp-card takes pins as `SecretString`
secrecy = "0.10"

# Yubikey PIV module. 0.9.0-rc.0 is the first release whose transmit loops GET RESPONSE on
# 61XX, which ISO 7816-compliant cards (Trussed among them) answer to a SELECT without Le.
yubikey = "0.9.0-rc.0"
# Features declared explicitly: `builder` gates CertificateBuilder/BuilderProfile *and* the
# TryFrom<SubjectPublicKeyInfoRef> impls for Subject/AuthorityKeyIdentifier, `hazmat` gates
# Time::INFINITY. They currently also arrive via yubikey's own dependency, but relying on
# feature unification would break on a yubikey patch release.
x509-cert = { version = "0.3", features = [ "builder", "hazmat", "pem" ]}
# The chain's DER encoding, its OIDs and key usage flags, and the SPKIs that `check` compares
der = { version = "0.8", features = [ "oid", "alloc", "flagset", "derive" ]}
spki = { version = "0.8", features = [ "fingerprint", "alloc" ]}
# Degenerate PKCS#7 (certs-only SignedData) for the YubiKey msroots object; still a
# prerelease, but it unifies with the final x509-cert 0.3 and der/spki 0.8 above.
cms = { version = "0.3.0-pre.2", features = [ "std" ]}
# The Web Key Directory names a mailbox by the SHA-1 of its local part (src/cli/output.rs);
# no key or certificate is hashed with it. Already in the tree through yubikey's stack.
sha1 = { version = "0.11", default-features = false }
# PIV keys out of the gap (`ungap --app piv`, src/piv/export.rs): PKCS#8 encrypted with
# PBES2, PBKDF2-HMAC-SHA256 and AES-256-CBC, the profile openssl writes by default and mail
# clients read. pkcs5's own PBES2 cannot resolve until scrypt 0.12 is released, so the few
# structures are built here from these, each already in the tree but cbc. Both wipe their
# key schedules on drop: aes has it through yubikey already, cbc's state needs it asked for.
aes = { version = "0.9", default-features = false, features = ["zeroize"] }
cbc = { version = "0.2", default-features = false, features = ["alloc", "block-padding", "zeroize"] }

# Not used directly: yubikey encrypts with the derived 3DES management key through des, and
# only this feature makes des wipe the key schedule it expands that key into.
des = { version = "0.9", default-features = false, features = ["zeroize"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
# NOTE: this is sha2 0.10 while yubikey/ecdsa pull sha2 0.11. Two majors coexist fine here
# because no sha2 type crosses the boundary -- do not "fix" this by bumping it. The one 0.11
# use is sha2-ecdsa below, which has to match ecdsa's digest generation.
sha2 = "0.10"
# Default features already give arithmetic + ecdsa + pem(-> pkcs8) + std(-> alloc), which is
# exactly the set x509-cert's Builder::build bounds require.
p256 = "0.14"
# OpenPGP P-256 signatures (src/pgp/signer.rs): RFC 6979 with the HMAC on the signature's own
# hash, SHA-512, which only the hazmat function takes (a SigningKey runs it on SHA-256).
# sequoia's own signer draws a random nonce, so these are what keep P-256 certificates
# reproducible, and their hash is part of the scheme like sha2 is. Both are the versions p256
# already pulls in; sha2 0.11 is renamed beside the 0.10 above.
ecdsa = { version = "0.17", default-features = false, features = ["algorithm"] }
sha2-ecdsa = { package = "sha2", version = "0.11", default-features = false }
# P-384 PIV chains under `--algorithm p384`, for consumers that insist on ECDSA P-384 (a Nix
# binary cache signing key, for one). Same major and default feature set as p256 above, for
# the same builder bounds; already in the tree through yubikey.
p384 = "0.14"
# Ed25519 PIV chains under `--algorithm curve25519`: signs certificates through x509-cert's
# builder, whose bounds `pkcs8` satisfies (SPKI encoding and the signature algorithm
# identifier). Versions unify with yubikey's own use of both dalek crates. `zeroize` wipes the
# signing keys on drop, asked for here rather than left to what another crate enables.
ed25519-dalek = { version = "3", default-features = false, features = [ "alloc", "pkcs8", "zeroize" ] }
# X25519 PIV key management keys on the same curve: only the public key is computed here,
# the card holds the secret. `static_secrets` is the long-lived key type, `zeroize` wipes it.
x25519-dalek = { version = "3", default-features = false, features = [ "static_secrets", "zeroize" ] }

[lib]
doctest = false

# Arithmetic that wraps silently in a release build is a wrong number nobody notices; here
# a wrong number can be a wrong key offset or certificate field, and a panic is the better
# outcome. The checks cost nothing measurable next to argon2. `panic` stays at its unwind
# default on purpose: an abort skips every `Drop`, and with it every `Zeroizing` wipe.
[profile.release]
overflow-checks = true

# The RSA prime search runs thousands of big-number operations per key; unoptimized they
# take tens of seconds per certificate chain in the test suite. Optimizing the arithmetic
# crates alone keeps debug builds of this crate debuggable and changes no result.
[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3

# Every derivation step is an argon2 pass over 64 MiB; unoptimized, one takes seconds, and a
# command takes several. Optimizing argon2 and its hash alone keeps this crate debuggable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# A PIV export stretches its passphrase with 600,000 rounds of HMAC-SHA256 (src/piv/export.rs);
# unoptimized, every key the test suite exports takes seconds. Optimizing the hash alone, as
# argon2's above, changes no result.
[profile.dev.package.sha2]
opt-level = 3

# cargo-machete scans source textually for each dependency's name; tiny-bip39's library is
# imported as `bip39` (see src/mnemonic.rs), which the scan cannot see, and des is there for
# its feature alone, so both are ignored here rather than flagged on every run.
[package.metadata.cargo-machete]
ignored = ["des", "tiny-bip39"]

[dev-dependencies]
# Unpredictable, self-cleaning temp paths for the tests that shell out to external tools
tempfile = "3"
# The on-card key agreement test (tests/piv_hardware/) needs `ecdh`, which is not in p256's
# default feature set. Kept here rather than on the main dependency so that a production
# build does not carry it -- Cargo unifies features per build, so test targets get it and
# `cargo build` does not.
p256 = { version = "0.14", features = [ "ecdh" ] }
# The same for P-384 key management keys, from the same test
p384 = { version = "0.14", features = [ "ecdh" ] }

[patch.crates-io]
# Until yubikey.rs releases its pending PRs: Yubico-compatible cards that are not
# YubiKeys (#680, a Nitrokey 3 reports 6.6.6), the installed management key algorithm
# (#681), Ed25519 certificates (#683), RSA-4096 import, and the SELECT response's
# application properties. A revision of the fork's mind-the-gap branch, upstream main plus
# those PRs, one commit each, rebuilt by the maintainer's stack generator; pinned by
# revision, see the sequoia note above.
yubikey = { git = "https://github.com/FlorianFranzen/yubikey.rs", rev = "d2e860cea360faf15fe9768ffcb39fb24e1e85ed" }
