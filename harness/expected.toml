# What every card is expected to do in the hardware suites, and what every simulated card
# covers. `nix run .#hardware-tests` compares each run with this file and records both in
# harness/results/; a result that differs from its expectation is reported either way, a
# failure where a pass was expected and a pass where a refusal was, so this file is changed
# deliberately and never drifts.
#
# Outcomes of a test on a card:
#   "pass"            the test passes
#   "refused"         the card is turned away before anything is written: the test fails,
#                     and says the card was not touched
#   "skip: <reason>"  not run on this card, and why
#
# A card is named here as in the local .env, which holds its serial (see
# docs/hardware-tests.md); the results in the repository name the card and its firmware,
# never its serial.

# ---------------------------------------------------------------- physical cards

[cards."yubikey-5.7"]
name = "YubiKey 5 series, firmware 5.7"
# The firmware the card has to report, as a prefix; another one is refused before any test
firmware = "5.7."

[cards."yubikey-5.7".piv]
provision_and_verify_card = "pass"
provision_and_verify_p256_card = "skip: the checklist above is P-256, end use included"
provision_and_verify_curve25519_card = "pass"
provision_and_verify_p384_card = "pass"
provision_and_verify_rsa2048_card = "pass"
provision_and_verify_rsa3072_card = "pass"
provision_and_verify_rsa4096_card = "pass"
upload_in_place = "pass"
rotate_in_place = "pass"
change_user_pin = "pass"
touch_is_enforced = "skip: needs a card whose touch the test refuses, a virtual one"

[cards."yubikey-5.7".pgp]
provision_and_verify_card = "pass"
provision_and_verify_p256_card = "pass"
provision_and_verify_rsa_cards = "pass"
upload_in_place = "pass"
rotate_in_place = "pass"
change_user_pin = "pass"
touch_is_enforced = "skip: needs a card whose touch the test refuses, a virtual one"

