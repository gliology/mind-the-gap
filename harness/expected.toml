# ---------------------------------------------------------------- simulated cards
#
# A check is a NixOS VM that provisions the card end to end and passes or fails as a
# whole; `covers` is what it asserts, by algorithm, as the check's own script spells out:
# "pass" provisioned and used, "refused" turned away before the reset, "open" possible but
# not run yet, "-" not offered; a note in parentheses narrows it.
# `sources` name the flake inputs and nixpkgs packages the card is built from, whose
# revisions every run records.

[simulated.virtual-piv]
card = "piv-authenticator over vpcd"
applet = "PIV"
sources = ["piv-authenticator", "nixpkgs:vsmartcard-vpcd"]
checks = ["virtual-piv", "virtual-piv-p384", "virtual-piv-curve25519", "virtual-piv-rsa2048", "virtual-piv-rsa3072", "virtual-piv-rsa4096"]
covers = { p256 = "pass", p384 = "pass", curve25519 = "pass", rsa2048 = "pass", rsa3072 = "pass", rsa4096 = "pass", touch = "pass (P-256)" }

[simulated.virtual-piv-builder]
card = "piv-authenticator over vpcd, unattended host profile"
applet = "PIV"
sources = ["piv-authenticator", "nixpkgs:vsmartcard-vpcd"]
checks = ["virtual-piv-builder", "virtual-piv-builder-tdes"]
covers = { p256 = "-", p384 = "pass", curve25519 = "-", rsa2048 = "-", rsa3072 = "-", rsa4096 = "-", touch = "-" }

[simulated.virtual-pgp]
card = "opcard over vpcd"
applet = "OpenPGP"
sources = ["opcard", "nixpkgs:vsmartcard-vpcd"]
checks = ["virtual-pgp"]
covers = { p256 = "pass", p384 = "-", curve25519 = "pass", rsa2048 = "pass", rsa3072 = "pass", rsa4096 = "pass", touch = "pass" }

[simulated.virtual-parallel]
card = "piv-authenticator and opcard over two vpcd readers, both suites at once"
applet = "PIV and OpenPGP"
sources = ["piv-authenticator", "opcard", "nixpkgs:vsmartcard-vpcd"]
checks = ["virtual-parallel"]
covers = { p256 = "pass", p384 = "-", curve25519 = "pass (OpenPGP)", rsa2048 = "pass (PIV)", rsa3072 = "-", rsa4096 = "-", touch = "-" }

[simulated.usbip-nk3]
card = "Nitrokey 3 firmware over USB/IP"
applet = "PIV and OpenPGP"
sources = ["nitrokey-3-firmware", "usbip-device"]
checks = ["usbip-nk3"]
covers = { p256 = "pass", p384 = "pass", curve25519 = "pass", rsa2048 = "pass", rsa3072 = "pass", rsa4096 = "pass", touch = "open" }

[simulated.usbip-gnuk]
card = "Gnuk emulation over USB/IP"
applet = "OpenPGP"
sources = ["gnuk"]
checks = ["usbip-gnuk"]
covers = { p256 = "refused", p384 = "-", curve25519 = "pass", rsa2048 = "refused", rsa3072 = "refused", rsa4096 = "refused", touch = "open" }

[simulated.canokey]
card = "CanoKey emulated by QEMU"
applet = "PIV and OpenPGP"
sources = ["nixpkgs:canokey-qemu", "nixpkgs:qemu"]
checks = ["canokey"]
covers = { p256 = "pass", p384 = "pass", curve25519 = "pass", rsa2048 = "pass", rsa3072 = "pass", rsa4096 = "pass", touch = "-" }
