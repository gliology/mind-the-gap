provision_and_verify_p256_card = "skip: the checklist above is P-256, end use included"
provision_and_verify_curve25519_card = "refused"
provision_and_verify_p384_card = "pass"
provision_and_verify_rsa2048_card = "pass"
provision_and_verify_rsa3072_card = "refused"
